<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>非遗音景疗愈 · 体验端</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1220'/%3E%3Ctext x='16' y='23' font-size='17' text-anchor='middle' fill='%237fd8c5' font-family='SimHei'%3E音%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/experience.css">
</head>
<body>
<div id="stage">
  <canvas id="scene"></canvas>
  <div id="hud">
    <div class="hud-left"><span id="hud-theme">山居静心</span><span id="hud-time">00:00 / 12:00</span><span id="hud-phase">准备</span></div>
    <div class="hud-right"><span id="hud-control">音量 50 · 亮度 60</span><button id="btn-finish" type="button">结束体验</button></div>
  </div>
  <div id="lobby" class="overlay">
    <div class="lobby-card">
      <div class="lobby-eyebrow">沉浸式非遗音景疗愈</div>
      <h1 id="lobby-theme">山居静心</h1>
      <p id="lobby-desc">高山禅院场景，以古琴泛音与呼吸球引导放松。</p>
      <div class="lobby-meta"><span id="lobby-code">体验者 20260605-001</span><span id="lobby-duration">12 分钟</span><span>呼吸 4-7-8</span></div>
      <button id="btn-start" type="button">开始体验</button>
      <p class="lobby-note">开始后将播放本地合成音景。请调整舒适坐姿，保持环境安静；如有不适，请立即点击右上角结束体验。</p>
    </div>
  </div>
  <div id="end-panel" class="overlay" hidden>
    <div class="lobby-card">
      <div class="lobby-eyebrow">本次体验结束</div>
      <h1 id="end-title">已完成</h1>
      <div id="end-metrics" class="end-metrics"></div>
      <p id="end-note">体验数据已回传控制台，报告可在控制台查看。</p>
      <button id="btn-close" type="button">关闭页面</button>
    </div>
  </div>
  <div id="error-panel" class="overlay" hidden>
    <div class="lobby-card"><h1>体验链接不可用</h1><p id="error-text">链接不存在或已过期。</p></div>
  </div>
</div>
<script src="js/breath.js"></script>
<script src="js/experience.js"></script>
</body>
</html>
